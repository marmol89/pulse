# Compila los instaladores: .exe (NSIS) en Windows, AppImage y .deb en Linux, y el APK de Android
# (firmado si están los secretos ANDROID_*; si no, debug).
# - Desde "Versiones", al publicar una versión: los adjunta a su release de GitHub.
# - A mano (pestaña Actions → "Instaladores" → Run workflow): los deja como artefactos del run, sin publicar nada.
name: Instaladores

on:
  workflow_call:
    inputs:
      etiqueta:
        description: Etiqueta de la release a la que se adjuntan (p. ej. v0.1.0)
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Windows
            os: windows-latest
            destino: --win
            archivos: dist/*.exe
          - nombre: Linux
            os: ubuntu-latest
            destino: --linux
            archivos: dist/*.AppImage dist/*.deb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.etiqueta || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Compilar
        run: npx electron-builder ${{ matrix.destino }} --publish never
        env:
          # Sin certificado: los instaladores salen sin firmar.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Adjuntar a la release
        if: inputs.etiqueta
        shell: bash
        run: gh release upload "${{ inputs.etiqueta }}" ${{ matrix.archivos }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Guardar como artefacto
        if: ${{ !inputs.etiqueta }}
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-${{ matrix.nombre }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      # Keystore de firma en base64 (secreto del repo). Sin ella sale el APK debug.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.etiqueta || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # El runner ya trae el SDK de Android (ANDROID_HOME); falta el JDK 21 que pide Capacitor 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - run: npm test

      # El .aab (App Bundle) es lo que se sube a Google Play; el .apk, para instalar a mano.
      - name: Compilar el APK y el App Bundle firmados
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pulse.jks"
          npm run android:release
          npm run android:bundle
        env:
          PULSE_KEYSTORE: ${{ runner.temp }}/pulse.jks
          PULSE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PULSE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Compilar el APK (debug, sin keystore)
        if: env.KEYSTORE_BASE64 == ''
        run: npm run android:apk

      - name: Adjuntar a la release
        if: inputs.etiqueta
        # nullglob: sin keystore no hay .aab y el patrón no debe llegar tal cual a gh.
        run: |
          shopt -s nullglob
          gh release upload "${{ inputs.etiqueta }}" dist/*.apk dist/*.aab --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Guardar como artefacto
        if: ${{ !inputs.etiqueta }}
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Android
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error
